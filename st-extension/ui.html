<div id="dsh-unified-settings">
    <h3>DSH 统一桥接设置</h3>
    <label>电脑桥接地址:</label>
    <input type="text" id="dsh-bridge-url" value="http://10.105.77.189:43121">
    <button onclick="saveDshSettings()">保存配置</button>
</div>

<script>
    function saveDshSettings() {
        const url = document.getElementById('dsh-bridge-url').value;
        localStorage.setItem('dsh_bridge_url', url);
        alert('配置已保存');
    }
</script>
